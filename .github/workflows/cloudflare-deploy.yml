name: Manual Cloudflare deploy
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: masar-cloudflare-production
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify secrets and use D1 ID without changing repository files
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          MASAR_D1_DATABASE_ID: ${{ secrets.MASAR_D1_DATABASE_ID }}
        run: |
          test -n "$CLOUDFLARE_API_TOKEN" || { echo "Missing Cloudflare API token secret"; exit 1; }
          test -n "$CLOUDFLARE_ACCOUNT_ID" || { echo "Missing Cloudflare account ID secret"; exit 1; }
          test -n "$MASAR_D1_DATABASE_ID" || { echo "Missing D1 database ID secret"; exit 1; }
          node -e "const fs=require('fs'); const p='wrangler.jsonc'; const s=fs.readFileSync(p,'utf8'); if (!s.includes('REPLACE_WITH_D1_DATABASE_ID')) process.exit(1); fs.writeFileSync(p,s.replace('REPLACE_WITH_D1_DATABASE_ID',process.env.MASAR_D1_DATABASE_ID));"
      - name: Install and test
        run: |
          npm install --no-audit --no-fund
          npm test
          npm run preflight
      - name: Apply remote D1 migrations
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler d1 migrations apply JOBS_DB --remote
      - name: Publish Worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler deploy
