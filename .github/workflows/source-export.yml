name: Masar deliverable source archive
on:
  pull_request:
    paths:
      - '.github/workflows/source-export.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  archive:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check no credentials are in the sources
        run: node scripts/preflight.mjs
      - name: Create complete Cloudflare source archive
        run: |
          zip -q -r -9 masar-cloudflare-source.zip . -x '.git/*' 'node_modules/*' '.wrangler/*' '.dev.vars' '.env' '*.zip' '*.pem' '*.key'
          test -s masar-cloudflare-source.zip
          unzip -t masar-cloudflare-source.zip | tail -1
      - uses: actions/upload-artifact@v4
        with:
          name: masar-cloudflare-complete-source
          path: masar-cloudflare-source.zip
          if-no-files-found: error
          retention-days: 14
