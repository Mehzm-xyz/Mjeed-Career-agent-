name: Masar Cloudflare bundle verification
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  bundle:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install deps (including PDF and DOCX parsers)
        run: npm ci --no-audit --no-fund
      - name: Run all Node regression tests
        run: npm test
      - name: Validate SQLite/D1 migrations and concurrency
        run: python3 scripts/test_sql_atomic.py
      - name: Exercise real local Worker and D1 runtime
        run: npm run test:runtime
      - name: Scan for accidental secrets
        run: npm run preflight
      - name: Inject fake UUID for offline bundle test only
        run: |
          node --input-type=module -e "import fs from 'node:fs'; const c=JSON.parse(fs.readFileSync('wrangler.jsonc'));c.d1_databases[0].database_id='00000000-0000-4000-8000-000000000000';fs.writeFileSync('.wrangler.bundle.jsonc',JSON.stringify(c));"
      - name: Verify Cloudflare bundle without publishing
        run: npx wrangler deploy --dry-run --config .wrangler.bundle.jsonc --outdir "$RUNNER_TEMP/masar-worker-bundle"
