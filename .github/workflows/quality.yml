name: Masar quality checks
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install locked dependencies
        run: npm ci --no-audit --no-fund
      - name: Logic tests
        run: node --test tests/*.test.mjs
      - name: Secret and configuration preflight
        run: node scripts/preflight.mjs
      - name: Real portable server smoke test
        run: npm run test:runtime
      - name: SQLite migrations and atomic guards
        run: python3 scripts/test_sql_atomic.py
