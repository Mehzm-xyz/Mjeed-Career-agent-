<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><title>نموذج اختبار داخلي</title></head><body>
<h1>نموذج اختبار داخلي — لا يرسل طلب توظيف</h1>
<form id="demo"><label>الاسم<input id="test-name" required></label><label>المسمى<input id="test-role" required></label><button id="test-send" type="submit">اختبار</button></form>
<p id="test-result" role="status"></p>
<script>document.querySelector('#demo').addEventListener('submit',e=>{e.preventDefault();document.querySelector('#test-result').textContent='DEMO-OK: simulated submission, nothing was sent';});</script>
</body></html>
